server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tamaño máximo del body (para subir videos)
    client_max_body_size 600M;

    # Assets estáticos con cache larga
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing: cualquier ruta sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy inverso a la API
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;

        # Headers estándar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming de videos: rangos
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # No bufferizar para streaming
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeouts largos para uploads
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}