services:
  postgres:
    image: postgres:16-alpine
    container_name: yunex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yunex
      POSTGRES_PASSWORD: yunex
      POSTGRES_DB: yunex_academy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yunex"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: