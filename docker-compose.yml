version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sot-postgres
    environment:
      POSTGRES_USER: sot
      POSTGRES_PASSWORD: sot
      POSTGRES_DB: school_of_training
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sot"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: sot-api
    env_file: apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api/uploads:/app/apps/api/uploads
    command: sh -c "pnpm migrate && pnpm seed && pnpm start"

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: sot-web
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres-data: